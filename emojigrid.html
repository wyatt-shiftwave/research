<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiftwave Session Survey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px;
            color: #ffffff;
        }
        
        .container {
            max-width: 460px;
            width: 100%;
        }
        
        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 36px;
        }
        
        .logo svg {
            height: 80px;
            width: auto;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        
        .header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }
        
        .header p {
            font-size: 0.9rem;
            color: #888888;
            line-height: 1.5;
        }
        
        /* Form inputs */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #333333;
            background: #151515;
            color: #ffffff;
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.15s;
            text-transform: uppercase;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #555555;
        }
        
        .form-group input::placeholder {
            color: #555555;
            text-transform: none;
        }
        
        /* Timing selector */
        .timing-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .timing-btn {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid #333333;
            background: #151515;
            color: #888888;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        
        .timing-btn:hover {
            border-color: #555555;
            color: #cccccc;
        }
        
        .timing-btn.active {
            background: #ffffff;
            border-color: #ffffff;
            color: #0a0a0a;
        }
        
        /* Instruction */
        .instruction {
            text-align: center;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: #666666;
        }
        
        /* Grid container */
        .grid-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 24px;
        }
        
        .emojigrid-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
        }
        
        /* The clickable grid */
        .emojigrid {
            position: absolute;
            top: 32px;
            left: 32px;
            right: 32px;
            bottom: 32px;
            background: #0f0f0f;
            border: 1px solid #444444;
            cursor: crosshair;
            touch-action: none;
        }
        
        /* Grid lines - dashed, consistent */
        .grid-line-h, .grid-line-v {
            position: absolute;
            background: transparent;
        }
        
        .grid-line-h {
            top: 50%;
            left: 0;
            right: 0;
            height: 0;
            border-top: 1px dashed #444444;
        }
        
        .grid-line-v {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 0;
            border-left: 1px dashed #444444;
        }
        
        /* Click marker */
        .marker {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ffffff;
            border: 2px solid #0a0a0a;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        .marker.visible {
            display: block;
        }
        
        /* Face labels - evenly spaced around perimeter */
        .face-label {
            position: absolute;
            width: 30px;
            height: 30px;
        }
        
        .face-label svg {
            width: 100%;
            height: 100%;
        }
        
        /* 
         * POSITIONING: Faces are evenly spaced on perimeter
         * Grid area: top/left/right/bottom = 32px inset
         * Face positions: 0%, 25%, 50%, 75%, 100% along each edge
         */
        
        /* Bottom row (y = 100%) - positions at 0%, 25%, 50%, 75%, 100% */
        .face-b1 { left: 16px; bottom: 16px; transform: translate(-50%, 50%); }
        .face-b2 { left: calc(32px + (100% - 64px) * 0.25); bottom: 16px; transform: translate(-50%, 50%); }
        .face-b3 { left: 50%; bottom: 16px; transform: translate(-50%, 50%); }
        .face-b4 { left: calc(32px + (100% - 64px) * 0.75); bottom: 16px; transform: translate(-50%, 50%); }
        .face-b5 { right: 16px; bottom: 16px; transform: translate(50%, 50%); }
        
        /* Top row (y = 0%) */
        .face-t1 { left: 16px; top: 16px; transform: translate(-50%, -50%); }
        .face-t2 { left: calc(32px + (100% - 64px) * 0.25); top: 16px; transform: translate(-50%, -50%); }
        .face-t3 { left: 50%; top: 16px; transform: translate(-50%, -50%); }
        .face-t4 { left: calc(32px + (100% - 64px) * 0.75); top: 16px; transform: translate(-50%, -50%); }
        .face-t5 { right: 16px; top: 16px; transform: translate(50%, -50%); }
        
        /* Left column (x = 0%) - positions at 25%, 50%, 75% (corners handled by top/bottom) */
        .face-l2 { left: 16px; top: calc(32px + (100% - 64px) * 0.75); transform: translate(-50%, -50%); }
        .face-l3 { left: 16px; top: 50%; transform: translate(-50%, -50%); }
        .face-l4 { left: 16px; top: calc(32px + (100% - 64px) * 0.25); transform: translate(-50%, -50%); }
        
        /* Right column (x = 100%) */
        .face-r2 { right: 16px; top: calc(32px + (100% - 64px) * 0.75); transform: translate(50%, -50%); }
        .face-r3 { right: 16px; top: 50%; transform: translate(50%, -50%); }
        .face-r4 { right: 16px; top: calc(32px + (100% - 64px) * 0.25); transform: translate(50%, -50%); }
        
        /* Center face - with background to sit above grid lines */
        .face-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 28px;
            z-index: 5;
            background: #0f0f0f;
            border-radius: 50%;
            padding: 2px;
        }
        
        .face-center svg {
            width: 100%;
            height: 100%;
        }
        
        /* Results display */
        .results {
            background: #151515;
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        .results.visible {
            display: block;
        }
        
        .results-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        .results-row:last-child {
            margin-bottom: 0;
        }
        
        .results-label {
            color: #666666;
        }
        
        .results-value {
            font-weight: 600;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
        }
        
        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #333333;
            color: #666666;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: not-allowed;
            transition: all 0.15s ease;
        }
        
        .submit-btn.ready {
            background: #ffffff;
            color: #0a0a0a;
            cursor: pointer;
        }
        
        .submit-btn.ready:hover {
            background: #e0e0e0;
        }
        
        .submit-btn.success {
            background: #333333;
            color: #888888;
        }
        
        /* Status message */
        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #666666;
        }
        
        .status.error {
            color: #cc6666;
        }
        
        .status.success {
            color: #888888;
        }
        
        /* Footer */
        .footer-note {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #222222;
            font-size: 0.7rem;
            color: #444444;
            text-align: center;
            line-height: 1.5;
        }
        
        .footer-note a {
            color: #666666;
        }
    </style>
</head>

                    <path class="sw-stroke" d="M26.5763,139.6068c27.9081-36.7802,60.3406-73.0841,107.016-36.4351,19.9609,15.6731,31.5719,38.7145,42.2836,61.0428,13.5072,28.1555,71.174,143.0793,86.152,173.8456,13.5364,27.8051,30.4243,57.3253,53.2228,78.7375,18.9516,17.7993,44.4958,31.8466,71.3917,26.9128,29.4438-5.4011,49.4339-30.0325,66.1928-52.5068,19.229-25.7866,36.8409-52.7093,55.926-78.5975,17.5294-23.7779,36.6763-53.15,65.55-64.1489,6.3524-2.4198,18.7196-3.1262,18.7196-3.1262,33.7659.7229,54.5888,31.7001,75.4118,54.933,36.4401,46.4658,62.4688,98.0945,109.3204,134.2345,83.2918,38.7215,140.5548-59.373,166.5835-121.3274,20.8229-46.4658,75.4832-170.3746,83.2918-185.8632,13.0143-23.2329,31.2344-46.4658,57.2631-43.8844,36.4401,0,59.8659,30.9772,79.3378,61.3092"/>

        </div>
        
        <!-- Header -->
        <div class="header">
            <h1>Session Check-In</h1>
            <p>Tap on the grid to indicate how you're feeling</p>
        </div>
        
        <!-- User ID -->
        <div class="form-group">
            <label for="userId">Your Initials</label>
            <input type="text" id="userId" placeholder="e.g., WR" maxlength="4" autocomplete="off">
        </div>
        
        <!-- Protocol Name -->
        <div class="form-group">
            <label for="protocolName">Protocol Name</label>
            <input type="text" id="protocolName" placeholder="e.g., Deep Rest, Energize, etc." autocomplete="off">
        </div>
        
        <!-- Timing -->
        <div class="timing-selector">
            <button class="timing-btn" data-timing="pre">Before Session</button>
            <button class="timing-btn" data-timing="post">After Session</button>
        </div>
        
        <!-- Grid -->
        <p class="instruction">Tap the point that matches how you feel right now</p>
        
        <div class="grid-container">
            <div class="emojigrid-wrapper">
                
                <!-- ===== BOTTOM ROW (Low Arousal): L→R = Unpleasant→Pleasant ===== -->
                <!-- B1: sleepy/sad - closed curved eyes, frown -->
                <div class="face-label face-b1">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><path d="M10 16 Q14 13 18 16" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M22 16 Q26 13 30 16" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M13 27 Q20 23 27 27" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </div>
                <!-- B2: sad - dot eyes, frown -->
                <div class="face-label face-b2">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="14" cy="16" r="2" fill="#5C4A1F"/><circle cx="26" cy="16" r="2" fill="#5C4A1F"/><path d="M13 26 Q20 22 27 26" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </div>
                <!-- B3: neutral - dot eyes, straight line -->
                <div class="face-label face-b3">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="14" cy="16" r="2" fill="#5C4A1F"/><circle cx="26" cy="16" r="2" fill="#5C4A1F"/><line x1="13" y1="26" x2="27" y2="26" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/></svg>
                </div>
                <!-- B4: content - dot eyes, slight smile -->
                <div class="face-label face-b4">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="14" cy="16" r="2" fill="#5C4A1F"/><circle cx="26" cy="16" r="2" fill="#5C4A1F"/><path d="M13 25 Q20 29 27 25" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </div>
                <!-- B5: relaxed/happy - happy curved eyes, smile -->
                <div class="face-label face-b5">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><path d="M10 17 Q14 20 18 17" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M22 17 Q26 20 30 17" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 24 Q20 30 28 24" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </div>
                
                <!-- ===== TOP ROW (High Arousal): L→R = Unpleasant→Pleasant ===== -->
                <!-- T1: angry/enraged - V brows, eyes, grimace with teeth -->
                <div class="face-label face-t1">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><path d="M8 11 L16 14" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/><path d="M32 11 L24 14" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="17" r="2.5" fill="#5C4A1F"/><circle cx="27" cy="17" r="2.5" fill="#5C4A1F"/><rect x="12" y="25" width="16" height="6" rx="1" fill="#5C4A1F"/><line x1="16" y1="25" x2="16" y2="31" stroke="#F5D547" stroke-width="1.5"/><line x1="20" y1="25" x2="20" y2="31" stroke="#F5D547" stroke-width="1.5"/><line x1="24" y1="25" x2="24" y2="31" stroke="#F5D547" stroke-width="1.5"/></svg>
                </div>
                <!-- T2: angry - V brows, eyes, open O mouth -->
                <div class="face-label face-t2">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><path d="M9 12 L16 15" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/><path d="M31 12 L24 15" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="17" r="2.5" fill="#5C4A1F"/><circle cx="27" cy="17" r="2.5" fill="#5C4A1F"/><ellipse cx="20" cy="28" rx="5" ry="4" fill="#5C4A1F"/></svg>
                </div>
                <!-- T3: surprised - big eyes, O mouth -->
                <div class="face-label face-t3">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="13" cy="15" r="3" fill="#5C4A1F"/><circle cx="27" cy="15" r="3" fill="#5C4A1F"/><ellipse cx="20" cy="27" rx="4" ry="5" fill="#5C4A1F"/></svg>
                </div>
                <!-- T4: excited/happy - eyes, big smile with teeth -->
                <div class="face-label face-t4">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="13" cy="14" r="3" fill="#5C4A1F"/><circle cx="27" cy="14" r="3" fill="#5C4A1F"/><path d="M11 22 Q20 34 29 22" fill="#5C4A1F"/><path d="M13 23 Q20 22 27 23" stroke="#F5D547" stroke-width="2"/></svg>
                </div>
                <!-- T5: ecstatic - happy curved eyes, huge grin with teeth -->
                <div class="face-label face-t5">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><path d="M9 14 Q13 18 17 14" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M23 14 Q27 18 31 14" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M10 21 Q20 35 30 21" fill="#5C4A1F"/><path d="M12 22 Q20 21 28 22" stroke="#F5D547" stroke-width="2"/></svg>
                </div>
                
                <!-- ===== LEFT COLUMN (Unpleasant): Bottom→Top = Low→High Arousal ===== -->
                <!-- L2: sad/down - dot eyes, frown -->
                <div class="face-label face-l2">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="14" cy="16" r="2" fill="#5C4A1F"/><circle cx="26" cy="16" r="2" fill="#5C4A1F"/><path d="M13 27 Q20 22 27 27" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </div>
                <!-- L3: distressed - X eyes, frown -->
                <div class="face-label face-l3">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><path d="M10 13 L18 19 M18 13 L10 19" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/><path d="M22 13 L30 19 M30 13 L22 19" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/><path d="M13 28 Q20 23 27 28" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </div>
                <!-- L4: anxious/worried - angled brows, eyes, open mouth -->
                <div class="face-label face-l4">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><path d="M9 12 L16 15" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/><path d="M31 12 L24 15" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="17" r="2.5" fill="#5C4A1F"/><circle cx="27" cy="17" r="2.5" fill="#5C4A1F"/><ellipse cx="20" cy="28" rx="4" ry="3" fill="#5C4A1F"/></svg>
                </div>
                
                <!-- ===== RIGHT COLUMN (Pleasant): Bottom→Top = Low→High Arousal ===== -->
                <!-- R2: content - dot eyes, smile -->
                <div class="face-label face-r2">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="14" cy="16" r="2" fill="#5C4A1F"/><circle cx="26" cy="16" r="2" fill="#5C4A1F"/><path d="M12 24 Q20 30 28 24" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </div>
                <!-- R3: happy - bigger eyes, bigger smile -->
                <div class="face-label face-r3">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="14" cy="15" r="2.5" fill="#5C4A1F"/><circle cx="26" cy="15" r="2.5" fill="#5C4A1F"/><path d="M11 23 Q20 31 29 23" stroke="#5C4A1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </div>
                <!-- R4: very happy - big eyes, open smile with teeth -->
                <div class="face-label face-r4">
                    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="13" cy="14" r="3" fill="#5C4A1F"/><circle cx="27" cy="14" r="3" fill="#5C4A1F"/><path d="M11 22 Q20 33 29 22" fill="#5C4A1F"/><path d="M13 23 Q20 22 27 23" stroke="#F5D547" stroke-width="2"/></svg>
                </div>
                
                <!-- Clickable grid area -->
                <div class="emojigrid" id="emojigrid">
                    <div class="grid-line-h"></div>
                    <div class="grid-line-v"></div>
                    
                    <!-- Center face with background -->
                    <div class="face-center">
                        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F5D547"/><circle cx="14" cy="16" r="2" fill="#5C4A1F"/><circle cx="26" cy="16" r="2" fill="#5C4A1F"/><line x1="14" y1="26" x2="26" y2="26" stroke="#5C4A1F" stroke-width="2" stroke-linecap="round"/></svg>
                    </div>
                    
                    <div class="marker" id="marker"></div>
                </div>
            </div>
        </div>
        
        <!-- Results -->
        <div class="results" id="results">
            <div class="results-row">
                <span class="results-label">Valence</span>
                <span class="results-value" id="valenceValue">—</span>
            </div>
            <div class="results-row">
                <span class="results-label">Arousal</span>
                <span class="results-value" id="arousalValue">—</span>
            </div>
        </div>
        
        <!-- Optional Comment -->
        <div class="form-group">
            <label for="comment">Notes (optional)</label>
            <textarea id="comment" placeholder="Any context about how you're feeling..." rows="2" style="width:100%; padding:12px 16px; border:1px solid #333; background:#151515; color:#fff; border-radius:6px; font-family:'Inter',sans-serif; font-size:0.9rem; resize:vertical;"></textarea>
        </div>
        
        <!-- Practice link -->
        <p class="practice-link" style="text-align:center; margin-bottom:20px; font-size:0.8rem;">
            <a href="https://app.gorilla.sc/participant" target="_blank" style="color:#666;">New to this? Practice with example images →</a>
        </p>
        
        <!-- Submit -->
        <button class="submit-btn" id="submitBtn">Submit</button>
        <p class="status" id="status"></p>
        
        <!-- Footer -->
        <div class="footer-note">
            Based on the validated <a href="https://doi.org/10.3389/fpsyg.2018.02396" target="_blank">EmojiGrid</a> (Toet et al., 2018)
        </div>
    </div>
    
    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0jprLZwPL7V5dYDmwxO-cOYKBmsl4_SfxSHGpQvVKnImBUb_aARrqbpQv4g9ML5Xt/exec';
        
        let state = { timing: null, valence: null, arousal: null, clicked: false };
        
        const grid = document.getElementById('emojigrid');
        const marker = document.getElementById('marker');
        const results = document.getElementById('results');
        const valenceDisplay = document.getElementById('valenceValue');
        const arousalDisplay = document.getElementById('arousalValue');
        const submitBtn = document.getElementById('submitBtn');
        const statusEl = document.getElementById('status');
        const userIdInput = document.getElementById('userId');
        const protocolInput = document.getElementById('protocolName');
        const commentInput = document.getElementById('comment');
        const timingBtns = document.querySelectorAll('.timing-btn');
        
        timingBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                timingBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.timing = btn.dataset.timing;
                checkReady();
            });
        });
        
        function handleGridInteraction(e) {
            e.preventDefault();
            const rect = grid.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            let y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
            
            state.valence = Math.round(x * 100);
            state.arousal = Math.round((1 - y) * 100);
            state.clicked = true;
            
            marker.style.left = `${x * 100}%`;
            marker.style.top = `${y * 100}%`;
            marker.classList.add('visible');
            
            results.classList.add('visible');
            valenceDisplay.textContent = state.valence;
            arousalDisplay.textContent = state.arousal;
            checkReady();
        }
        
        grid.addEventListener('click', handleGridInteraction);
        grid.addEventListener('touchstart', handleGridInteraction);
        
        function checkReady() {
            const userId = userIdInput.value.trim();
            const protocol = protocolInput.value.trim();
            submitBtn.classList.toggle('ready', userId && protocol && state.timing && state.clicked);
        }
        
        userIdInput.addEventListener('input', checkReady);
        protocolInput.addEventListener('input', checkReady);
        
        submitBtn.addEventListener('click', async () => {
            const userId = userIdInput.value.trim().toUpperCase();
            const protocol = protocolInput.value.trim();
            if (!userId || !protocol || !state.timing || !state.clicked) return;
            
            submitBtn.textContent = 'Submitting...';
            submitBtn.classList.remove('ready');
            statusEl.textContent = '';
            statusEl.className = 'status';
            
            const data = {
                timestamp: new Date().toISOString(),
                userId: userId,
                protocol: protocol,
                timing: state.timing,
                valence: state.valence,
                arousal: state.arousal,
                comment: commentInput.value.trim()
            };
            
            try {
                if (GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                    console.log('Demo mode:', data);
                    console.table(data);
                    statusEl.textContent = '✓ Demo: logged to console';
                    statusEl.className = 'status success';
                    submitBtn.textContent = 'Submitted';
                    submitBtn.classList.add('success');
                    return;
                }
                
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                statusEl.textContent = '✓ Response recorded';
                statusEl.className = 'status success';
                submitBtn.textContent = 'Submitted';
                submitBtn.classList.add('success');
            } catch (error) {
                console.error('Error:', error);
                statusEl.textContent = 'Error. Try again.';
                statusEl.className = 'status error';
                submitBtn.textContent = 'Submit';
                submitBtn.classList.add('ready');
            }
        });
        
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('user')) userIdInput.value = urlParams.get('user');
        if (urlParams.get('timing')) {
            const btn = document.querySelector(`.timing-btn[data-timing="${urlParams.get('timing')}"]`);
            if (btn) btn.click();
        }
    </script>
</body>
